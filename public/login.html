<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In &middot; Flipkart Scraper Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    };
  </script>
</head>
<body class="h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-slate-800 antialiased font-sans">
  
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <!-- Brand Mark -->
    <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white font-bold text-2xl items-center justify-center shadow-lg shadow-brand-500/25 mb-4">
      FK
    </div>
    <h2 class="text-2xl font-bold tracking-tight text-slate-900">Sign in to FK-Scraper</h2>
    <p class="mt-1 text-xs text-slate-500">Flipkart Ads Wallet &amp; Weekly Search Trends Automation</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 sm:rounded-2xl border border-slate-200/80 sm:px-10">
      
      <!-- Error Alert -->
      <div id="error-alert" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
        <svg class="w-4 h-4 text-rose-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke-width="2"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"/></svg>
        <span id="error-message">Invalid credentials.</span>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wide">Username</label>
          <div class="mt-1.5">
            <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="admin"
              class="block w-full appearance-none rounded-xl border border-slate-300 px-3.5 py-2.5 placeholder-slate-400 text-slate-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 text-sm font-medium transition-all" />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wide">Password</label>
          <div class="mt-1.5 relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
              class="block w-full appearance-none rounded-xl border border-slate-300 px-3.5 py-2.5 pr-10 placeholder-slate-400 text-slate-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 text-sm font-medium transition-all" />
            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div>
          <button id="submit-btn" type="submit"
            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all">
            Sign In
          </button>
        </div>
      </form>

      <!-- Security Notice -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400">
          Protected by HTTPS &amp; Brute-Force Rate Limiting &middot; FK-Scraper v1.0
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Invalid credentials.');
        }

        submitBtn.textContent = 'Success! Redirecting...';
        submitBtn.classList.remove('bg-brand-600', 'hover:bg-brand-700');
        submitBtn.classList.add('bg-emerald-600');

        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect') || '/';
        window.location.href = redirectUrl;
      } catch (err) {
        errorMessage.textContent = err.message;
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
