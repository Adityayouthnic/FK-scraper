<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search Trends Scraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@450;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <svg style="display:none" aria-hidden="true">
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <line x1="4" y1="6" x2="20" y2="6"/><circle class="icon-solid" cx="14" cy="6" r="2"/>
      <line x1="4" y1="12" x2="20" y2="12"/><circle class="icon-solid" cx="8" cy="12" r="2"/>
      <line x1="4" y1="18" x2="20" y2="18"/><circle class="icon-solid" cx="16" cy="18" r="2"/>
    </symbol>
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </symbol>
    <symbol id="icon-logs" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 9l3 3-3 3"/><line x1="12" y1="15" x2="17" y2="15"/>
    </symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"/>
      <path d="M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/>
      <circle class="icon-solid" cx="16" cy="14" r="1.4"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path class="icon-solid" d="M8 5v14l11-7z"/>
    </symbol>
    <symbol id="icon-browser" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
    </symbol>
    <symbol id="icon-trending" viewBox="0 0 24 24">
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
      <polyline points="17 6 23 6 23 12"/>
    </symbol>
  </svg>

  <aside class="sidebar-slim">
    <span class="brand-mark">FK</span>
    <nav class="sidebar-slim-nav">
      <a class="slim-link" href="/" title="Wallet Scraper"><svg class="icon"><use href="#icon-wallet"/></svg></a>
      <a class="slim-link active" href="/trends" title="Search Trends"><svg class="icon"><use href="#icon-trending"/></svg></a>
    </nav>
    <div class="sidebar-slim-footer">
      <a class="slim-link" href="#" title="Settings"><svg class="icon"><use href="#icon-settings"/></svg></a>
    </div>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Search Trends</span>
        <span class="topbar-sep">/</span>
        <span class="topbar-subtitle">Flipkart Seller &middot; NXT Insights</span>
        <div id="status-pill" class="status-pill status-idle">
          <span class="status-dot"></span>
          <span id="status-text">Idle</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="header-controls">
          <div class="control-group">
            <label for="vertical-select" class="header-stat-label">Vertical</label>
            <select id="vertical-select" class="header-select">
              <option value="all">All Verticals (Default)</option>
              <option value="women_ethnic_set">Women Ethnic Set</option>
              <option value="women_sari">Women Sari</option>
              <option value="Women_Kurta_And_Kurti">Women Kurta And Kurti</option>
            </select>
          </div>
          <div class="control-group">
            <label for="pages-input" class="header-stat-label">Pages</label>
            <input id="pages-input" class="header-input" type="number" min="1" max="50" value="10" title="Pages to scrape per vertical (50 rows/page)" />
          </div>
        </div>
        <div class="header-divider"></div>
        <div class="header-stats">
          <div class="header-stat">
            <span class="header-stat-label">Status</span>
            <span class="header-stat-value" id="stat-status">Idle</span>
          </div>
          <div class="header-divider"></div>
          <div class="header-stat">
            <span class="header-stat-label">Last Run</span>
            <span class="header-stat-value" id="stat-last-run">&mdash;</span>
          </div>
          <div class="header-divider"></div>
          <div class="header-stat">
            <span class="header-stat-label">Rows Added</span>
            <span class="header-stat-value" id="stat-rows-added">&mdash;</span>
          </div>
          <div class="header-divider"></div>
          <div class="header-stat">
            <span class="header-stat-label">Result</span>
            <span class="header-stat-value" id="stat-last-result">&mdash;</span>
          </div>
        </div>
        <button id="run-btn" class="run-btn" type="button">
          <svg class="icon icon-solid"><use href="#icon-play"/></svg>
          <span>Run Scraper</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="workspace-grid">
        <section class="panel">
          <div class="panel-header">
            <div class="window-dots"><span></span><span></span><span></span></div>
            <span id="live-badge" class="live-badge"><span class="ping-dot"></span>Live View</span>
          </div>
          <div class="view-wrap">
            <img id="live-view" alt="The live browser view appears here while a run is in progress. Click and type on it to control the remote browser." draggable="false" />
            <div id="view-placeholder" class="view-placeholder-content">
              <svg class="icon"><use href="#icon-browser"/></svg>
              <p>Live browser view will appear here while running. You can click and type directly into it — e.g. to solve a captcha or click Login.</p>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <span class="header-stat-label" style="font-size:12px;text-transform:none;letter-spacing:normal;color:var(--text-secondary);font-weight:600">Activity Log</span>
          </div>
          <pre id="log"></pre>
        </section>
      </div>
    </main>
  </div>

  <script src="/trends.js"></script>
</body>
</html>
